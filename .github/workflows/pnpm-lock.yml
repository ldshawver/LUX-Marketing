name: Generate pnpm-lock.yaml if missing

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Generate pnpm-lock.yaml if missing
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml not found, generating..."
            pnpm install
          else
            echo "pnpm-lock.yaml already exists, skipping generation."
          fi

      - name: Commit pnpm-lock.yaml if generated
        if: success()
        run: |
          if ! git diff --quiet pnpm-lock.yaml 2>/dev/null && [ -f pnpm-lock.yaml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: generate pnpm-lock.yaml"
            git push
          else
            echo "No changes to commit."
          fi
